name: CI - CD
on:
  push:
    branches:
      - main
      - moderation-and-filters

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Maven Repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn -B verify -Pci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/bookstore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Insall dependencies
        run: npm i

      - name: Build frontend
        run: npm run build

  build_and_push_images:
    name: Build and push Docker images
    needs: [ backend, frontend ]
    if: github.ref == 'ref/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server/app
          file: ./server/app/Dockerfile
          push: true
          tags: |
            ghcr.io/crusaderrrr/bookstore-backend:moderation-and-filters

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client/bookstore
          file: ./client/bookstore/Dockerfile
          push: true
          tags: |
            ghcr.io/crusaderrrr/bookstore-frontend:moderation-and-filters

      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ghcr.io/crusaderrrr/my-postgres-db:latest

  deploy_to_ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_and_push_images
    if: github.ref == 'ref/heads/main'
    steps:
      - name: Execute remote deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Bookstore
            docker login ghcr.io -u crusaderrrr --password-stdin <<< "${{ secrets.GHCR_TOKEN }}"
            sudo docker-compose pull
            sudo docker compose up -d --remove-orphans